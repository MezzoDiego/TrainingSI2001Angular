<div><app-my-snackbar /></div>
<div class="bg-sky-100 flex justify-center items-center h-screen">
  <div class="w-1/2 h-screen hidden lg:block bg-blue-400"
    style="background-image: url('assets/main.jpg'); background-repeat: no-repeat; background-size: contain; background-position: center;">
  </div>
  <div class="lg:p-36 md:p-52 sm:20 p-8 w-full lg:w-1/2">
    <div class="form-logo flex justify-center text-2xl font-bold mb-6 ">RentalCars</div>
    <h1 class="text-2xl font-semibold mb-4">Login</h1>
    <form (ngSubmit)="onClick(loginForm)" #loginForm="ngForm">
      <div class="mb-4 bg-sky-100">
        <label for="inputUsername" class="block text-gray-600">Username</label>
        <input type="text" id="inputUsername" name="username" required
          class="w-full border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:border-blue-500" [ngModel]
          #userVar="ngModel" [ngClass]="{'is-invalid': (userVar.touched || userVar.dirty) && !userVar.valid }">

        <span class="invalid-feedback text-red-500 text-sm"
          *ngIf="userVar.errors?.['required'] && (userVar.touched || userVar.dirty)">
          Prego inserire un valore
        </span>
      </div>
      <div class="mb-4">
        <label for="inputPassword" class="block text-gray-800">Password</label>
        <input type="password" id="inputPassword" name="password" required [ngModel] #passwordVar="ngModel"
          class="w-full border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:border-blue-500"
          [ngClass]="{'is-invalid': (passwordVar.touched || passwordVar.dirty) && !passwordVar.valid }">

        <span class="invalid-feedback text-red-500 text-sm"
          *ngIf="passwordVar.errors?.['required'] && (passwordVar.touched || passwordVar.dirty)">
          Prego inserire un valore
        </span>

      </div>
      <button [disabled]="loginForm.invalid" type="submit" id="pro"
        class="bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-md py-2 px-4 w-full disabled:bg-gray-600">Login</button>
    </form>
  </div>
</div>
