<table>
  <thead>
    <tr>
      <th *ngFor="let header of tableConfig.headers">
        {{ header.label }}
      </th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let row of data">
      <td *ngFor="let header of tableConfig.headers">
        {{ header.key ? row[header.key] : '' }}
      </td>
    </tr>
  </tbody>
</table>
